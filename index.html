<!doctype html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>قوغدۇغۇچى — ئۈسكۈنە ۋاقتى</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;padding:24px;background:var(--tg-theme-bg-color,#fcfcfc);color:var(--tg-theme-text-color,#202020);font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center}
    main{width:100%;max-width:480px;text-align:center}
    .icon{font-size:48px;margin-bottom:14px}
    h1{font-size:22px;margin:0 0 16px}
    p{line-height:1.8}
    .zone{direction:ltr;unicode-bidi:isolate;font-size:24px;font-weight:700;overflow-wrap:anywhere}
    button,.fallback{width:100%;min-height:52px;padding:14px;border:0;border-radius:12px;background:var(--tg-theme-button-color,#2476d8);color:var(--tg-theme-button-text-color,#fff);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:block}
    button:disabled{opacity:.55;cursor:default}
    .hint{display:block;opacity:.75;margin-top:18px;line-height:1.7}
    .error{color:#bf3030}
    .fallback{margin-top:14px;background:#48647a}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">🕒</div>
  <h1>قوغدۇغۇچى — ئۈسكۈنە ۋاقتى</h1>
  <p id="status" role="status" aria-live="polite">ئۈسكۈنىڭىزنىڭ ۋاقىت رايونى ئېنىقلىنىۋاتىدۇ...</p>
  <p class="zone" id="zone"></p>
  <button id="save" type="button" disabled>✅ ۋاقىت رايونىنى ساقلاش</button>
  <a class="fallback" id="fallback" href="#" hidden>↩️ بوتقا قايتىپ تەستىقلاش</a>
  <small class="hint">پەقەت ئۈسكۈنىڭىزنىڭ ۋاقىت رايونى ئەۋەتىلىدۇ. GPS ئورنى، رەسىم ياكى شەخسىي ھۆججەتلەر ئوقۇلمايدۇ.</small>
</main>
<script>
(function () {
  'use strict';
  const status = document.getElementById('status');
  const zone = document.getElementById('zone');
  const save = document.getElementById('save');
  const fallback = document.getElementById('fallback');
  const app = window.Telegram && window.Telegram.WebApp;
  const params = new URLSearchParams(window.location.search);
  const botName = params.get('bot') || '';
  let timezone = '';

  function say(message, isError) {
    status.textContent = message;
    status.classList.toggle('error', Boolean(isError));
  }

  try {
    timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (!/^[A-Za-z0-9_+.\/-]{1,80}$/.test(timezone)) {
      throw new Error('ئۈسكۈنىڭىزنىڭ ۋاقىت رايونىنى ئېنىقلىيالمىدۇق.');
    }
    zone.textContent = timezone;
    save.disabled = false;
    say('ۋاقىت رايونىڭىز بايقالدى. ساقلاش ئۈچۈن كۇنۇپكىنى بېسىڭ.', false);
  } catch (error) {
    zone.textContent = '—';
    say(error.message || 'ۋاقىت رايونىنى ئېنىقلىيالمىدۇق.', true);
  }

  try {
    if (app && typeof app.ready === 'function') app.ready();
    if (app && typeof app.expand === 'function') app.expand();
  } catch (_ignored) { }

  save.addEventListener('click', function () {
    if (!timezone) return;
    if (!/^[A-Za-z0-9_]{5,32}$/.test(botName)) {
      say('بۇ بەتنى قوغدۇغۇچى بوتىدىكى «✅ ھەئە» كۇنۇپكىسى ئارقىلىق ئېچىڭ.', true);
      return;
    }
    // Inline Mini Apps cannot use app.sendData(). A signed server endpoint
    // would be required to deliver data silently. Instead, return to the
    // already-open Telegram bot through an ordinary deep link. Telegram may
    // require the person to tap Start once; the bot validates a short-lived
    // pending permission and the user's current group-admin status.
    const encoded = btoa(timezone).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const payload = 'tz_' + encoded;
    if (payload.length > 64) {
      say('ۋاقىت رايونى نامى بەك ئۇزۇن. قولدا تەڭشەڭ.', true);
      return;
    }
    const url = 'https://t.me/' + botName + '?start=' + payload;
    fallback.href = url;
    fallback.hidden = false;
    say('بوتقا قايتىپ، Telegram دا «Start / باشلاش» چىقسا بېسىڭ. شۇنداق قىلغاندا ۋاقىت رايونى ساقلىنىدۇ.', false);
    try {
      if (app && typeof app.openTelegramLink === 'function') {
        app.openTelegramLink(url);
      } else {
        window.location.assign(url);
      }
    } catch (_ignored) {
      // Fallback link is visible and clickable if the client blocks navigation.
    }
  });
})();
</script>
</body>
</html>

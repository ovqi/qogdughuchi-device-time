<!doctype html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>قوغدۇغۇچى — ئۈسكۈنە ۋاقتى</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; padding: 24px;
      background: var(--tg-theme-bg-color, #fcfcfc);
      color: var(--tg-theme-text-color, #202020);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    main { width: 100%; max-width: 480px; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 14px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    p { line-height: 1.8; }
    .zone {
      direction: ltr; unicode-bidi: isolate;
      font-size: 24px; font-weight: 700; overflow-wrap: anywhere;
    }
    button {
      width: 100%; min-height: 52px; padding: 14px; border: 0; border-radius: 12px;
      background: var(--tg-theme-button-color, #2476d8);
      color: var(--tg-theme-button-text-color, #fff);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
    .hint { display: block; opacity: .75; margin-top: 18px; line-height: 1.7; }
    .error { color: #bf3030; }
  </style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">🕒</div>
  <h1>قوغدۇغۇچى — ئۈسكۈنە ۋاقتى</h1>
  <p id="status" role="status" aria-live="polite">ئۈسكۈنىڭىزنىڭ ۋاقىت رايونى ئېنىقلىنىۋاتىدۇ...</p>
  <p class="zone" id="zone"></p>
  <button id="save" type="button" disabled>✅ ۋاقىت رايونىنى ساقلاش</button>
  <small class="hint">پەقەت ئۈسكۈنىڭىزنىڭ ۋاقىت رايونى بوتقا ئەۋەتىلىدۇ. GPS ئورنى ياكى شەخسىي ھۆججەتلەر ئوقۇلمايدۇ.</small>
</main>
<script>
(function () {
  'use strict';

  const status = document.getElementById('status');
  const zone = document.getElementById('zone');
  const save = document.getElementById('save');
  const app = window.Telegram && window.Telegram.WebApp;
  let timezone = '';

  function explain(message, isError) {
    status.textContent = message;
    status.classList.toggle('error', Boolean(isError));
  }

  try {
    timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (!/^[A-Za-z0-9_+.\/-]{1,80}$/.test(timezone)) {
      throw new Error('ئۈسكۈنىڭىزنىڭ ۋاقىت رايونىنى ئېنىقلىيالمىدۇق.');
    }
    zone.textContent = timezone;
    save.disabled = false;
    explain('ۋاقىت رايونىڭىز بايقالدى. ساقلاش ئۈچۈن ئاستىدىكى كۇنۇپكىنى بېسىڭ.', false);
  } catch (error) {
    zone.textContent = '—';
    explain(error.message || 'ۋاقىت رايونىنى ئېنىقلىيالمىدۇق.', true);
  }

  try {
    if (app && typeof app.ready === 'function') app.ready();
    if (app && typeof app.expand === 'function') app.expand();
  } catch (_ignored) {
    // Showing the timezone does not depend on optional Telegram UI methods.
  }

  save.addEventListener('click', function () {
    if (!timezone) return;
    if (!app || typeof app.sendData !== 'function') {
      explain('بوتقا ئەۋەتىش ئۈچۈن بۇ بەتنى Telegram دىكى «ھەئە» كۇنۇپكىسى ئارقىلىق ئېچىڭ.', true);
      return;
    }
    save.disabled = true;
    explain('ۋاقىت رايونى بوتقا ئەۋەتىلىۋاتىدۇ...', false);
    try {
      // IMPORTANT: only a deliberate tap sends data. Telegram can close a
      // keyboard-launched Mini App immediately after sendData().
      app.sendData(JSON.stringify({
        kind: 'qogdughuchi_device_timezone_v1',
        timezone: timezone
      }));
      // Do not claim success here: the bot must validate and confirm receipt.
      explain('ئەگەر بەت يېپىلمىسا، Telegram دىكى بوتنىڭ جەزملەشتۈرۈشىنى تەكشۈرۈڭ.', false);
      save.disabled = false;
    } catch (error) {
      explain('ئەۋەتىش مەغلۇپ بولدى. Telegram بوتىنىڭ ئىچىدىن قايتا سىناڭ.', true);
      save.disabled = false;
    }
  });
})();
</script>
</body>
</html>
